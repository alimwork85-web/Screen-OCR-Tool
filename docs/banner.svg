<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 360" width="1280" height="360" role="img" aria-label="OCR Tool 2.0.0">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#149AA3"/>
      <stop offset="1" stop-color="#0A4563"/>
    </linearGradient>
    <linearGradient id="icon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1FB0BA"/>
      <stop offset="1" stop-color="#0A4563"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="360" rx="28" fill="url(#bg)"/>

  <!-- أيقونة التطبيق (نفس هندسة assets/app_icon.svg بمقياس 0.27) -->
  <g transform="translate(90 40) scale(0.27)">
    <rect width="1024" height="1024" rx="230" fill="#FFFFFF" fill-opacity="0.14"/>
    <g fill="none" stroke="#FFFFFF" stroke-width="64" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="250,400 250,250 400,250"/>
      <polyline points="624,250 774,250 774,400"/>
      <polyline points="774,624 774,774 624,774"/>
      <polyline points="400,774 250,774 250,624"/>
    </g>
    <g stroke-linecap="round" stroke-width="58">
      <line x1="384" y1="420" x2="648" y2="420" stroke="#F5B544"/>
      <line x1="448" y1="512" x2="648" y2="512" stroke="#FFFFFF"/>
      <line x1="518" y1="604" x2="648" y2="604" stroke="#FFFFFF"/>
    </g>
  </g>

  <g font-family="Tajawal, 'Segoe UI', Arial, sans-serif" fill="#FFFFFF">
    <text x="410" y="140" font-size="64" font-weight="700">أداة قراءة النصوص من الشاشة</text>
    <text x="410" y="205" font-size="40" font-weight="700" letter-spacing="1">OCR Tool · Screen Text Extractor</text>
    <text x="410" y="262" font-size="26" fill-opacity="0.9">Arabic + English · Ctrl+Shift+X · Windows</text>
  </g>
  <g font-family="'Segoe UI', Arial, sans-serif">
